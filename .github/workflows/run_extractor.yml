name: Run Document Title Extractor

'on':
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-title-extractor:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run extractor
        run: |
          python src/run_extractor.py

      - name: Commit output CSV to repository
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add -f data/output/extracted_titles.csv

          if git diff --cached --quiet; then
            echo "No output changes to commit"
          else
            git commit -m "Add extracted title output"
            git push
          fi

      - name: Upload output artifact
        uses: actions/upload-artifact@v4
        with:
          name: extracted-title-output
          path: data/output/extracted_titles.csv
